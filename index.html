<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fuja da Prova!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div>
        <span class="eyebrow">PROJETO ESCOLAR</span>
        <h1>Fuja da Prova!</h1>
      </div>
      <div class="stats">
        <div><span>Pontos</span><strong id="score">0</strong></div>
        <div><span>Tempo</span><strong id="time">60</strong></div>
        <div><span>Vidas</span><strong id="lives">♥♥♥</strong></div>
      </div>
    </header>

    <section class="game-area">
      <canvas id="gameCanvas" width="900" height="520"></canvas>

      <div id="startScreen" class="overlay">
        <div class="card">
          <div class="logo">📚</div>
          <h2>Fuja da Prova!</h2>
          <p>O intervalo está acabando. Encontre a saída antes do tempo terminar.</p>
          <div class="controls">
            <span>↑ ↓ ← →</span>
            <span>ou</span>
            <span>W A S D</span>
          </div>
          <button id="startBtn">COMEÇAR JOGO</button>
          <small>Colete livros e moedas. Evite professores!</small>
        </div>
      </div>

      <div id="message" class="message hidden"></div>
    </section>

    <footer>
      <span>Fase <strong id="level">1</strong>/3</span>
      <span id="objective">Encontre a saída!</span>
    </footer>
  </main>

  <script src="java.js"></script>
</body>
</html>
